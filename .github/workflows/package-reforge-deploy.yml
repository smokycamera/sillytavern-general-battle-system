name: Package reforge deploy repair
on:
  push:
    branches: [fix/reforge-deploy-compat-v1.3.22]
    paths: [.github/workflows/package-reforge-deploy.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed changes with exact-match guards
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          def edit(path, old, new):
           p=root/path; s=p.read_text(); assert s.count(old)==1,(path,s.count(old),old[:70]); p.write_text(s.replace(old,new))
          edit('panel/src/item-spec.ts','/** 正文仅提供机制与规格；属性、骰子、身份、种子与版本仍由插件计算。 */', '''/** 名称只是显示前缀；只读取分隔符后明确写出的机制，不按名称猜装备。 */
          export function splitItemSpecification(text: string): { name?: string; spec: string } {
            const value = text.trim(), colon = value.search(/[:：]/);
            const separator = colon >= 0 ? colon : value.search(/[·｜|/／]/);
            if (separator < 0) return { spec: value };
            const name = value.slice(0, separator).trim(), spec = value.slice(separator + 1).trim();
            if (!name || !spec || /[:：·｜|/／]/.test(spec)) throw new Error('装备规格使用“名称:效果L强度”或“效果L强度”，每项只写一个明确规格');
            return { name, spec };
          }
          
          /** 正文仅提供机制与规格；属性、骰子、身份、种子与版本仍由插件计算。 */''')
          edit('panel/src/item-spec.ts', "  const label = text.trim().replace", "  text = splitItemSpecification(text).spec;\n  const label = text.trim().replace")
          edit('panel/src/item-spec.ts', '.match(/^([^:：|]+?)[lL](\\d{1,2})$/)', '.match(/^([^:：|]+?)\\s*[lL]\\s*(\\d{1,2})$/)')
          edit('panel/src/tags.ts', "import { parseItemSpecification } from './item-spec.js';", "import { parseItemSpecification, splitItemSpecification } from './item-spec.js';")
          edit('panel/src/tags.ts', "suggestions.push({ kind: 'reforge', id: a.id.trim(), name: a.name?.trim() || undefined, spec, raw });", "suggestions.push({ kind: 'reforge', id: a.id.trim(), name: a.name?.trim() || splitItemSpecification(a.spec).name, spec, raw });")
          edit('panel/src/unit-set.ts', "import { parseItemSpecification } from './item-spec.js';", "import { parseItemSpecification, splitItemSpecification } from './item-spec.js';")
          edit('panel/src/unit-set.ts', '''      const parts = config.spec.split(/[:：]/); if (parts.length > 2) throw Error('装备规格使用名称:效果L等级');
                if (parts.length === 2) name = parts.shift()!;
                spec = parseItemSpecification(parts[0]!);''', '''      const named = splitItemSpecification(config.spec);
                name = named.name;
                spec = parseItemSpecification(named.spec);''')
          edit('panel/src/protocol.ts', "import { normalizeNarrativeSkill } from './spec-tolerance.js';", "import { normalizeNarrativeSkill } from './spec-tolerance.js';\nimport { parseItemSpecification } from './item-spec.js';")
          edit('panel/src/protocol.ts', "unit_update: ['id', 'hp', 'hpMax', 'reason'],", "unit_update: ['id', 'hp', 'hpMax', 'morale', 'state', 'clear', 'reason'],")
          edit('panel/src/protocol.ts', "if (['hp', 'hpMax'].some((key) => {\n            const field = key as 'hp' | 'hpMax';", "if (['hp', 'hpMax', 'morale', 'state'].some((key) => {\n            const field = key as 'hp' | 'hpMax' | 'morale' | 'state';")
          edit('panel/src/protocol.ts', " 的人数/生命更新冲突，请明确采用哪个绝对值", " 的人数/生命、士气或状态更新冲突，请明确采用哪个绝对值")
          edit('panel/src/protocol.ts', '''          if (event.hpMax !== undefined) existing.hpMax = event.hpMax;
                    const merged: Record<string, string> = { id: existing.id! };
                    for (const key of ['hp', 'hpMax', 'reason'] as const) if (existing[key] !== undefined) merged[key] = String(existing[key]);''', '''          if (event.hpMax !== undefined) existing.hpMax = event.hpMax;
                    if (event.morale !== undefined) existing.morale = event.morale;
                    if (event.state !== undefined) existing.state = event.state;
                    if (event.clear?.length) existing.clear = [...new Set([...(existing.clear ?? []), ...event.clear])];
                    if (event.reason) existing.reason = [existing.reason, event.reason].filter(Boolean).join('；');
                    const merged: Record<string, string> = { id: existing.id! };
                    for (const key of ['hp', 'hpMax', 'morale', 'state', 'reason'] as const) if (existing[key] !== undefined) merged[key] = String(existing[key]);
                    if (existing.clear?.length) merged.clear = existing.clear.join(',');''')
          edit('panel/src/protocol.ts', "  if (kind === 'unit_update' && (!attrs.id?.trim() || (attrs.hp === undefined && attrs.hpMax === undefined))) throw new Error('unit_update 需要 id 与 hp/hpMax');", '''  if (kind === 'unit_update') {
              if (!attrs.id?.trim() || !['hp', 'hpMax', 'morale', 'state', 'clear'].some(key => attrs[key]?.trim())) throw new Error('unit_update 需要 id 与明确的生命/人数、士气、状态或清除效果');
              if (!integer('morale', 0, 1e9)) throw new Error('unit_update 士气必须是非负整数');
              if (attrs.state !== undefined && !['ready', 'dying', 'dead', 'routing', 'fled'].includes(attrs.state)) throw new Error('unit_update 状态须为ready/dying/dead/routing/fled');
            }
            if (kind === 'reforge' && (!attrs.id?.trim() || !attrs.spec?.trim())) throw new Error('reforge 需要真实装备id与明确spec');
            if ((kind === 'reforge' || kind === 'give') && attrs.spec !== undefined) {
              // 先保留具体错误原因，避免旧标签解析器将所有规格错误折叠成“无法解析”。
              const spec = parseItemSpecification(attrs.spec, attrs);
              if (kind === 'reforge' && spec.kind === 'consumable') throw new Error('消耗品不能重铸');
            }''')
          edit('panel/src/protocol-syntax.ts', "'reserves', 'speed']);", "'reserves', 'speed', 'morale']);")
          edit('panel/src/protocol-syntax.ts', "if (['skills', 'traits', 'effects'].includes(key)) {", "if (['skills', 'traits', 'effects', 'clear'].includes(key)) {")
          edit('panel/src/narrative-state.ts', '/** 整包准备与校验；调用方持久化成功后才替换当前事实。 */', '''/** 同一档案允许互补/相同赋值；真正冲突仍需澄清，不能靠执行顺序暗中覆盖。 */
          function assertCompatibleUnitChanges(events: Suggestion[]): void {
            const changes = new Map<string, Map<string, string>>();
            const aliases: Record<string, string> = { state: 'status', speed: 'speedTier', weapon2: 'sidearm',
              'base.hpMax': 'hpMax', 'base.atk': 'atk', 'base.def': 'def', 'base.spd': 'spd', 'base.moraleMax': 'moraleMax',
              'formation.members': 'hp', 'formation.capacity': 'hpMax' };
            for (const event of events) {
              if (event.kind !== 'unit-set' && event.kind !== 'unit-update') continue;
              const fields = changes.get(event.id!) ?? new Map<string, string>();
              changes.set(event.id!, fields);
              const visit = (value: unknown, path: string): void => {
                if (value === undefined) return;
                if (value && typeof value === 'object' && !Array.isArray(value)) {
                  for (const [key, child] of Object.entries(value)) visit(child, path ? path + '.' + key : key);
                  return;
                }
                path = aliases[path] ?? path;
                const encoded = JSON.stringify(value);
                for (const [previous, encodedPrevious] of fields) {
                  if (previous === path ? encodedPrevious !== encoded : previous.startsWith(path + '.') || path.startsWith(previous + '.')) {
                    throw new Error(`档案 ${event.id} 的 ${path} 更新冲突，请合并为明确的绝对值`);
                  }
                }
                fields.set(path, encoded);
              };
              visit(event.kind === 'unit-set' ? event.data : { hp: event.hp, hpMax: event.hpMax, morale: event.morale, status: event.state }, '');
            }
          }
          
          /** 整包准备与校验；调用方持久化成功后才替换当前事实。 */''')
          edit('panel/src/narrative-state.ts', "  const changed = new Set<string>();", "  assertCompatibleUnitChanges(proposal.events);")
          edit('panel/src/narrative-state.ts', '''    if (event.kind === 'unit-update' || event.kind === 'unit-set') {
                if (changed.has(event.id)) throw new Error('同一回复不能多次更新同一档案，请合并为一个绝对更新');
                changed.add(event.id);
              }
          ''', '')
          edit('panel/src/narrative-state.ts', '  // 顺序固定：更新全部档案，再部署。后续任一步失败只丢弃此候选副本。', '  // 固定阶段：补员/状态 → 单位字段 → 实物改造/学习/效果 → 部署。deploy写在前面也使用最终档案。\n  // 版本只对批次开始前的事实校验；后续任一步失败只丢弃此候选副本。')
          edit('panel/src/unit-set.test.ts', '''    expect(()=>transact(save,{xp:25},'<unit_update id="u1" hp="50"/>').next()).toThrow(/多次更新/);''', '''    // 同批互补修改合法；显式冲突仍不能落库。
              expect(restored(transact(save,{xp:25},'<unit_update id="u1" hp="50"/>').next())).toMatchObject({ xp:25, hp:50 });
              expect(()=>transact(save,{hp:40},'<unit_update id="u1" hp="50"/>').next()).toThrow(/冲突/);''')
          p=root/'assets/worldbook/!通用战斗系统约束.json'
          s=p.read_text()
          for a,b in [('轻型投射指投石索等相似类，导弹归类为火炮，普通施法归类为法杖，分清楚weapon和skill','轻型投射指投石索等，轻中机枪归为步枪，重机枪归为低级机炮，导弹归为火炮，普通施法归为法杖，分清楚weapon和skill'),('(战况结算只能由系统完成，绝对禁止描写完战况后变更)',''),('禁止用于战况结算，只用于战场外修改!','')]:
           assert s.count(a)==1,a
           s=s.replace(a,b)
          p.write_text(s)
          for name in ['package.json','package-lock.json']:
           p=root/name; p.write_text(p.read_text().replace('"version": "1.3.21"','"version": "1.3.22"'))
          p=root/'extension/manifest.json'; p.write_text(p.read_text().replace('"version": "1.3.20"','"version": "1.3.22"'))
          PY
          node --input-type=module -e "import {nativeSourceFingerprint} from './scripts/native-build-fingerprint.mjs'; if(nativeSourceFingerprint()!=='d897eaebe755224be55175c3b41a4c2481462be197ab18c393d5d94d3170b7c1')throw Error('Reviewed source fingerprint differs');"
      - name: Install dependencies
        run: npm ci
      - name: Type and focused regression checks
        run: |
          npm run typecheck
          mkdir -p artifacts/reforge-deploy
          npx vitest run panel/src/reforge-deploy.test.ts panel/src/unit-set.test.ts panel/src/narrative-state.test.ts panel/src/protocol.test.ts host/tests/reforge-worldbook.test.ts --reporter=default --reporter=json --outputFile=artifacts/reforge-deploy/targeted.json
      - name: Build installable extension
        run: npm run build:extension && npm run verify:dist
      - name: Install browser
        run: |
          npx playwright-core install --with-deps chromium
          node --input-type=module -e "import {chromium} from 'playwright-core'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_ENV,'TB_BROWSER='+chromium.executablePath()+'\n');"
      - name: Native browser checks for both host save contracts
        run: |
          npm run smoke:extension
          TB_METADATA_MODE=legacy-full npm run smoke:extension
      - name: Commit source and synchronized dist without temporary workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: fix/reforge-deploy-compat-v1.3.22
        run: |
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          rm .github/workflows/package-reforge-deploy.yml
          git add -A -- panel/src/item-spec.ts panel/src/tags.ts panel/src/unit-set.ts panel/src/unit-set.test.ts panel/src/narrative-state.ts panel/src/protocol.ts panel/src/protocol-syntax.ts panel/src/reforge-deploy.test.ts host/tests/reforge-worldbook.test.ts assets/worldbook extension/manifest.json package.json package-lock.json manifest.json dist .github/workflows/package-reforge-deploy.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: support named reforge and atomic deployment batches (v1.3.22)'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reforge-deploy-validation
          path: |
            artifacts/reforge-deploy/
            artifacts/native-extension-smoke/
            release/native-candidate/
          retention-days: 7
