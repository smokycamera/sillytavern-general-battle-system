name: Package reforge deploy repair
on:
  push:
    branches: [fix/reforge-deploy-compat-v1.3.22]
    paths: [.github/workflows/package-reforge-deploy.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source patch
        env:
          PATCH_B64: 
        run: |
          echo 'Payload is installed by the next reviewed update.'
          exit 1
