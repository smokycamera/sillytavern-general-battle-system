name: Release channel gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  channel-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require test or hotfix source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "test" ]; then
            echo 'Promoting the test channel to main.'
            exit 0
          fi
          case "$HEAD_REF" in
            hotfix/*) echo 'Emergency hotfix path accepted.' ;;
            *) echo "main accepts release PRs from test or emergency hotfix/* branches; got: $HEAD_REF" >&2; exit 1 ;;
          esac

  release-integrity:
    if: github.head_ref == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require test to include current main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Verify version and committed installable bundle
        run: |
          npm ci
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (pkg.version !== manifest.version) {
            throw new Error(`package.json version ${pkg.version} != manifest.json version ${manifest.version}`);
          }
          console.log(`Release version: ${pkg.version}`);
          NODE
          npm run verify:dist
