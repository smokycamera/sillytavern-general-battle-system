name: Package verified overmatch candidate
on:
  push:
    branches: [research/overmatch-v10-20260928]
permissions:
  contents: write
jobs:
  package:
    if: >-
      github.event.head_commit.message == 'chore: stage verified overmatch candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the locally tested source and verify exact SHA-256 hashes
        run: python3 .overmatch-apply.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run engine/tests/overmatch-v10.test.ts engine/tests/overmatch-v7.test.ts
      - run: npm run build:extension && npm run verify:dist
      - name: Install test browser
        id: browser
        continue-on-error: true
        run: npx playwright-core install --with-deps chromium
      - name: Both native save contracts
        id: smoke
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: |
          export TB_BROWSER=$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")
          result=0
          npm run smoke:extension || result=$?
          TB_METADATA_MODE=legacy-full npm run smoke:extension || result=$?
          exit "$result"
      - name: Commit verified source and installable bundle on this branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          actual=$(git ls-remote origin refs/heads/research/overmatch-v10-20260928 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          rm .overmatch-apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/src panel/src/main.ts package.json package-lock.json dist manifest.json .overmatch-apply.py
          git commit -m 'feat: continuous grade suppression with progressive distant tail and synced dist'
          git push origin HEAD:refs/heads/research/overmatch-v10-20260928
          git archive HEAD | gzip > /tmp/overmatch-verified-source.tar.gz
      - name: Record browser outcomes
        if: always()
        run: |
          echo 'Browser install: ${{ steps.browser.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native smoke: ${{ steps.smoke.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overmatch-candidate-evidence
          path: |
            /tmp/overmatch-verified-source.tar.gz
            artifacts/
          retention-days: 14
