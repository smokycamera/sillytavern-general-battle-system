name: Verify approved V11 resource candidate
on:
  push:
    branches: [research/resource-v11-20260928]
permissions:
  contents: write
jobs:
  verify:
    if: >-
      github.event.head_commit.message == 'chore: verify approved V11 resource candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact locally tested sources
        run: |
          cat .v11-patch.1 .v11-patch.2 .v11-patch.3 | gzip -d > /tmp/v11-source.patch
          python3 - <<'PY'
          import json, hashlib, pathlib, subprocess
          m=json.loads(pathlib.Path('.v11-source-manifest.json').read_text())
          assert hashlib.sha256(pathlib.Path('/tmp/v11-source.patch').read_bytes()).hexdigest()==m['patchSha256']
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/v11-source.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/v11-source.patch'],check=True)
          for file,sha in m['files'].items():
            assert hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()==sha,file
          PY
          mkdir -p artifacts/v11
          cp .v11-source-manifest.json artifacts/v11/verified-source.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:extension && npm run verify:dist
      - name: Complete tests with unchanged baseline failures explicitly verified
        run: |
          npm test -- --reporter=default --reporter=json --outputFile=artifacts/v11/full-tests.json || true
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const m=JSON.parse(readFileSync('.v11-source-manifest.json','utf8'));
          const d=JSON.parse(readFileSync('artifacts/v11/full-tests.json','utf8'));
          const failures=d.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==='failed').map(t=>({name:t.fullName,message:t.failureMessages[0].split('\n')[0]}));
          const order=(a,b)=>a.name.localeCompare(b.name);
          assert.deepEqual(failures.sort(order),m.baselineTests.failures.sort(order));
          assert.equal(d.numTotalTests,1317);assert.equal(d.numFailedTests,7);assert.equal(d.numPendingTests,0);
          writeFileSync('artifacts/v11/validation.json',JSON.stringify({total:d.numTotalTests,passed:d.numPassedTests,failed:d.numFailedTests,newFailures:0,allGreen:false,baseline:m.baselineTests,failures},null,2));
          JS
      - name: Cross-mechanism final regression - 240 complete battles
        run: |
          node node_modules/vite-node/vite-node.mjs scripts/audit-overmatch-curves.ts --label=v11-final --phase=integration --rules=v11 --offset=104729 --shard=7 --shards=10 --out=artifacts/v11/battles
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(s) for s in pathlib.Path('artifacts/v11/battles/v11-final-integration-7.jsonl').read_text().splitlines()]
          assert len(rows)==240 and len({r['id'] for r in rows})==240
          assert all(r.get('finished') and not r.get('error') for r in rows)
          PY
      - name: Bounded cadence probes - not counted as complete battles
        run: node node_modules/vite-node/vite-node.mjs scripts/probe-sp-cadence.ts --out=artifacts/v11/cadence-balanced.json
      - name: Browser regression under both host save contracts
        run: |
          npx playwright-core install --with-deps chromium
          export TB_BROWSER=$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")
          result=0
          npm run smoke:extension || result=$?
          TB_METADATA_MODE=legacy-full npm run smoke:extension || result=$?
          exit "$result"
      - name: Commit verified sources and bundle to research branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          actual=$(git ls-remote origin refs/heads/research/resource-v11-20260928 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .v11-patch.1 .v11-patch.2 .v11-patch.3 .v11-source-manifest.json .github/workflows/v11-candidate-verify.yml
          git add engine/src engine/tests/resources-v11.test.ts panel/src package.json package-lock.json manifest.json scripts/audit-sp-v11.ts scripts/probe-sp-cadence.ts scripts/compare-sp-v11.py scripts/audit-overmatch-curves.ts
          git add -A -- dist .v11-patch.1 .v11-patch.2 .v11-patch.3 .v11-source-manifest.json .github/workflows/v11-candidate-verify.yml
          git commit -m 'feat: soften low-grade overmatch and constrain spell endurance (V11)'
          git push origin HEAD:refs/heads/research/resource-v11-20260928
          git archive HEAD | gzip > artifacts/v11/source.tar.gz
          git rev-parse HEAD > artifacts/v11/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-resource-verification
          path: artifacts/
          retention-days: 14
