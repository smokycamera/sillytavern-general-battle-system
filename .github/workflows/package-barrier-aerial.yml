name: Package barrier and aerial candidate

on:
  push:
    branches: [work/barrier-aerial-targeting-20260929]
    paths: [.github/workflows/package-barrier-aerial.yml]

permissions:
  contents: write

concurrency:
  group: package-barrier-aerial
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Apply checksum-verified source candidate
        run: |
          test "$(git rev-parse HEAD^)" = 5395b9b64b34a976fe9b49d8e4703a1afbf16b5c
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = (
          ''
          ''
          ''
          ''
          )
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6e035bdb466a1eca6ac0a7daf65e268460cd3487969f510d3b1886f6754498c1'
          target = pathlib.Path('/tmp/barrier-candidate.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies and regression checks
        run: |
          npm ci
          npm run typecheck
          mkdir -p artifacts/barrier-aerial
          npx vitest run engine/tests/aerial-targeting-v10.test.ts engine/tests/barrier-preview-cache.test.ts --reporter=default --reporter=json --outputFile=artifacts/barrier-aerial/regression.json
          npm run test:extension
          npm run test:jev-relay
      - name: Build directly installable files
        run: npm run build:extension && npm run verify:dist
      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'TB_BROWSER=' + chromium.executablePath() + '\n')"
      - name: Browser tests for both save contracts
        run: |
          result=0
          npm run smoke:extension || result=$?
          TB_METADATA_MODE=legacy-full npm run smoke:extension || result=$?
          exit "$result"
      - name: Record browser results and publish source with dist
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          REVIEW_BRANCH: work/barrier-aerial-targeting-20260929
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          reports = [json.loads(pathlib.Path('artifacts/native-extension-smoke', mode, 'report.json').read_text()) for mode in ('metadata-only', 'legacy-full')]
          assert all(r['status'] == 'passed' and r['realHost'] is False for r in reports)
          out = {'version':'1.3.20','status':'passed','realHost':False,'sourcePatchSha256':'6e035bdb466a1eca6ac0a7daf65e268460cd3487969f510d3b1886f6754498c1','runUrl':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'reports':reports}
          pathlib.Path('docs/barrier-aerial-browser-20260929.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --exit-code HEAD^ -- assets/worldbook dist/assets/worldbook
          rm .github/workflows/package-barrier-aerial.yml
          git diff --check
          actual=$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- engine/src engine/tests/aerial-targeting-v10.test.ts engine/tests/barrier-preview-cache.test.ts panel/src extension/manifest.json package.json package-lock.json manifest.json dist docs/barrier-aerial-20260929.md docs/barrier-aerial-results-20260929.json docs/barrier-aerial-browser-20260929.json scripts/benchmark-barrier-preview.ts .github/workflows/package-barrier-aerial.yml
          git commit -m 'fix: cache shield previews and unify aerial targeting (v1.3.20)'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barrier-aerial-candidate-${{ github.run_id }}
          path: |
            artifacts/barrier-aerial/
            artifacts/native-extension-smoke/
            docs/barrier-aerial-browser-20260929.json
            dist/
            manifest.json
          if-no-files-found: warn
          retention-days: 7
