name: Prepare tested V9 resource branch
on:
  push:
    branches: [feat/level-resources-v9-20260928]
permissions:
  contents: write
concurrency:
  group: prepare-level-resources-v9
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply locally tested source and remove bootstrap files
        run: |
          git merge-base --is-ancestor 8a782ecadc3b6212af6eba2e9093725cdde2d0b1 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.github/resources-v9.patch.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '762f027254cf66b7efcdd83c9eb3868bf38395794f8631a4dc71b3e1f2f35696'
          pathlib.Path('/tmp/resources-v9.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero --whitespace=error-all /tmp/resources-v9.patch
          git rm .github/workflows/prepare-resources-v9.yml .github/resources-v9.patch.b64
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Resource and battle-report regressions
        run: npx vitest run engine/tests/resources-v9.test.ts engine/tests/flight-v2.test.ts engine/tests/summon-skills.test.ts engine/tests/mobility-v2.test.ts engine/tests/haste-actions.test.ts engine/tests/generic-skills.test.ts
      - name: Rebuild installable extension
        run: npm run build:extension && npm run verify:dist
      - name: Verify source fingerprint and publish non-forced commit
        run: |
          node --input-type=module -e "import {nativeSourceFingerprint} from './scripts/native-build-fingerprint.mjs'; if (nativeSourceFingerprint() !== 'b65ab78447e9351e956bffe529942c7d5eb1b71bd17369b4a8c7467fb91d568d') throw Error('Source differs from locally tested tree');"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- engine panel docs/resources-v9.md package.json package-lock.json scripts/package-extension.mjs dist manifest.json
          git diff --cached --check
          git commit -m 'feat: level-scaled SP, fatigue and recovery (v1.3.15)'
          git push origin HEAD:refs/heads/feat/level-resources-v9-20260928
