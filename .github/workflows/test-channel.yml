name: Test channel CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-channel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'build: sync test channel bundle') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Full unit and integration suite
        run: |
          mkdir -p artifacts/test-channel
          full_exit=0
          npm test -- --reporter=default --reporter=json --outputFile=artifacts/test-channel/full-tests.json || full_exit=$?
          echo "Ordinary npm test exit: $full_exit"
          node scripts/check-layered-test-baseline.mjs artifacts/test-channel/full-tests.json
      - name: Native host, persistence and relay regressions
        run: |
          npm run test:extension
          npm run test:jev-relay
      - name: Optional MCP server protocol
        run: |
          npm ci --prefix mcp --no-audit --no-fund
          npm test --prefix mcp
      - name: Build installable test bundle
        run: |
          npm run build:extension
          npm run verify:dist
      - name: Commit generated test bundle
        if: github.event_name == 'push'
        run: |
          test "$(git ls-remote origin refs/heads/test | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- dist manifest.json
          if git diff --cached --quiet; then
            echo 'Test bundle already matches source.'
            exit 0
          fi
          git commit -m 'build: sync test channel bundle'
          git push origin HEAD:refs/heads/test
