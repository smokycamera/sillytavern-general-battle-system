name: Integrate latest main into verified V11 candidate
on:
  push:
    branches: [research/resource-v11-20260928]
permissions:
  contents: write
jobs:
  integrate:
    if: >-
      github.event.head_commit.message == 'chore: integrate latest main into verified V11 candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate current-main fixes without overriding source conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff c81395e030dd6fa73091927f31b63f0446f6ae7c; then
            conflicts=$(git diff --name-only --diff-filter=U)
            test -n "$conflicts"
            if printf '%s\n' "$conflicts" | grep -v '^dist/'; then exit 1; fi
          fi
          git rm -rf --ignore-unmatch dist
          mkdir -p artifacts/v11-final
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:extension && npm run verify:dist
      - name: Independently measure latest main full-test baseline
        run: |
          git worktree add /tmp/v11-main-baseline c81395e030dd6fa73091927f31b63f0446f6ae7c
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/v11-main-baseline/node_modules
          cd /tmp/v11-main-baseline
          npm run build:extension
          npm test -- --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/artifacts/v11-final/main-tests.json" || true
      - name: Compare complete candidate suite to latest main
        run: |
          npm test -- --reporter=default --reporter=json --outputFile=artifacts/v11-final/full-tests.json || true
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const base=JSON.parse(readFileSync('artifacts/v11-final/main-tests.json','utf8'));
          const next=JSON.parse(readFileSync('artifacts/v11-final/full-tests.json','utf8'));
          const failures=d=>d.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==='failed').map(t=>({name:t.fullName,message:t.failureMessages[0].split('\n')[0]})).sort((a,b)=>a.name.localeCompare(b.name));
          assert.ok(base.numTotalTests>=1287);assert.equal(next.numTotalTests,base.numTotalTests+30);
          assert.equal(base.numPendingTests,0);assert.equal(next.numPendingTests,0);
          assert.deepEqual(failures(next),failures(base));
          assert.equal(next.numFailedTests,base.numFailedTests);
          const counts=d=>({total:d.numTotalTests,passed:d.numPassedTests,failed:d.numFailedTests});
          writeFileSync('artifacts/v11-final/validation.json',JSON.stringify({baseMain:'c81395e030dd6fa73091927f31b63f0446f6ae7c',baseline:counts(base),candidate:counts(next),failures:failures(next),newFailures:0,allGreen:next.numFailedTests===0},null,2));
          JS
      - name: Additional 240 cross-mechanism complete battle replays
        run: |
          node node_modules/vite-node/vite-node.mjs scripts/audit-overmatch-curves.ts --label=v11-final-main --phase=integration --rules=v11 --offset=104729 --shard=7 --shards=10 --out=artifacts/v11-final/battles
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(s) for s in pathlib.Path('artifacts/v11-final/battles/v11-final-main-integration-7.jsonl').read_text().splitlines()]
          assert len(rows)==240 and len({r['id'] for r in rows})==240
          assert all(r.get('finished') and not r.get('error') for r in rows)
          PY
      - name: Browser smoke for both native save contracts
        run: |
          npx playwright-core install --with-deps chromium
          export TB_BROWSER=$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")
          result=0
          npm run smoke:extension || result=$?
          TB_METADATA_MODE=legacy-full npm run smoke:extension || result=$?
          exit "$result"
      - name: Commit verified merged sources and regenerated dist
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          actual=$(git ls-remote origin refs/heads/research/resource-v11-20260928 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          rm .github/workflows/v11-final-integration.yml
          git add -A -- dist .github/workflows/v11-final-integration.yml
          git commit -m 'merge: preserve main narration and entry-morale fixes in verified V11 bundle'
          git push origin HEAD:refs/heads/research/resource-v11-20260928
          git archive HEAD | gzip > artifacts/v11-final/source.tar.gz
          git rev-parse HEAD > artifacts/v11-final/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-final-integration
          path: artifacts/
          retention-days: 14
